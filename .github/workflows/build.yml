name: Build & Publish Phira Static Data

on:
  workflow_dispatch:
    inputs:
      songs:
        description: "Songs to include: all, or a number (e.g. 28)"
        default: "all"
        required: false
      levels:
        description: "Difficulties: IN,AT (default) or EZ,HD,IN,AT"
        default: "IN,AT"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies (ffmpeg)
        run: |
          set -e
          if ! command -v ffmpeg >/dev/null 2>&1; then
            if [ "$(uname -s)" = "Darwin" ]; then
              brew install ffmpeg
            else
              sudo apt-get update -qq
              sudo apt-get install -y -qq ffmpeg
            fi
          fi
          ffmpeg -version | head -1
          python3 -m pip install --upgrade pip
          python3 -m pip install -r pipeline/requirements.txt

      - name: Build dataset (Phigros_Resource -> Phira chart packages)
        run: |
          set -e
          python3 pipeline/build.py \
            --songs "${{ github.event.inputs.songs || 'all' }}" \
            --levels "${{ github.event.inputs.levels || 'IN,AT' }}" \
            --jobs 8

      - name: Publish data (Releases + Pages content)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAGES_BASE: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          set -e
          python3 publish/publish.py --repo "$GITHUB_REPOSITORY" --pages-base "$PAGES_BASE"

      - name: Upload chart packages + images to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=$(python3 -c "import json;print(json.load(open('release-plan.json'))['tag'])")
          CTAG="$TAG-charts"
          ATAG="$TAG-assets"
          CH_N=$(wc -l < upload-charts.txt | tr -d ' ')
          AS_N=$(wc -l < upload-assets.txt | tr -d ' ')
          have() { gh release view "$1" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets|length' 2>/dev/null || echo 0; }
          if [ "$(have "$CTAG")" = "$CH_N" ]; then
            echo "Release $CTAG already complete ($CH_N charts) - skip."
          else
            gh release view "$CTAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
              gh release create "$CTAG" --repo "$GITHUB_REPOSITORY" \
                --title "Phira data $TAG (charts)" --notes "Chart packages for the static Shadowrocket setup."
            xargs -P 4 -n 20 gh release upload "$CTAG" --clobber --repo "$GITHUB_REPOSITORY" < upload-charts.txt
          fi
          if [ "$(have "$ATAG")" = "$AS_N" ]; then
            echo "Release $ATAG already complete ($AS_N assets) - skip."
          else
            gh release view "$ATAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
              gh release create "$ATAG" --repo "$GITHUB_REPOSITORY" \
                --title "Phira data $TAG (images)" --notes "Illustrations / preview audio for the static Shadowrocket setup."
            xargs -P 4 -n 20 gh release upload "$ATAG" --clobber --repo "$GITHUB_REPOSITORY" < upload-assets.txt
          fi

      - name: Save publish metadata (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-metadata
          path: |
            release-plan.json
            upload-charts.txt
            upload-assets.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: published

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
